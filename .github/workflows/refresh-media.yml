name: Refresh Media Library

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios rss-parser

      - name: Run media refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/refresh-media.js

      - name: Commit updated media
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "lulz-sec-bot"
          git add data/podcasts.json
          git diff --staged --quiet || git commit -m "chore: refresh media library"
          git push
